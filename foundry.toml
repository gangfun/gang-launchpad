[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

# LaunchpadU is over the EIP-170 limit without IR (~26.3KB). Compile that file
# (and files that import it, i.e. the draft deploy script) with IR (~24.3KB).
# Main Launchpad stays on the default pipeline.
# LaunchpadV2 was compiled with via-ir (the REFPOOL pack's foundry.toml).
# PoolCheck is a public library so the pad stays under EIP-170.
additional_compiler_profiles = [{ name = "via-ir", via_ir = true }]
compilation_restrictions = [
    { paths = "src/stocks/LaunchpadU.sol", via_ir = true },
    { paths = "src/launchpad-v2/**", via_ir = true },
    { paths = "src/launchpad-v3/**", via_ir = true },
]

# Deployed LaunchpadV2 sources are kept as broadcast. forge fmt skips them.
[fmt]
ignore = ["src/launchpad-v2/**", "test/launchpad-v2/**", "script/DeployWireMainnetV2.s.sol"]

[fuzz]
runs = 1000

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
# BscScan explorer data → Etherscan API V2 (same key, chainId 56)
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56, url = "https://api.etherscan.io/v2/api" }
