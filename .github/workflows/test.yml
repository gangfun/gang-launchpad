name: CI

permissions: {}

# Pushes run CI only on main; other branches are checked through their pull request
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run; main runs always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      # Forge keeps per-file content hashes in cache/, so a restored cache only recompiles what changed.
      # The via-ir pipeline makes a cold build take 20+ minutes.
      - name: Restore Forge build cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: forge-${{ runner.os }}-${{ hashFiles('foundry.toml', '.gitmodules', 'src/**/*.sol') }}
          restore-keys: |
            forge-${{ runner.os }}-

      # Tests run locally before a PR (`forge test`, plus the fork suites with an RPC): CI only checks format and
      # builds the contracts in src/ (sizes included). test/ and script/ compile when the tests run locally.
      - name: Run Forge build
        run: forge build src --sizes

  web-prod-guard:
    name: Web prod API guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Ban localhost indexer URL in dist
        working-directory: .
        run: |
          if command -v rg >/dev/null 2>&1; then
            HIT=$(rg -n --hidden -g '!*.map' '127\.0\.0\.1:8787' web/dist || true)
          else
            HIT=$(grep -RIn --exclude='*.map' '127.0.0.1:8787' web/dist || true)
          fi
          if [[ -n "${HIT}" ]]; then
            echo "$HIT"
            echo "::error::web/dist contains 127.0.0.1:8787 — use web/.env.production (VITE_API_URL=/api)"
            exit 1
          fi
          echo "OK: no 127.0.0.1:8787 in web/dist"
